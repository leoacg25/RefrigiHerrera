<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#04154B">
  <link rel="icon" type="image/png" href="logo.png">
  <title>RefrigiHerrera - Iniciar Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{font-family:'Inter',sans-serif;margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#04154B;position:relative;overflow:hidden}
    body::before{content:'';position:absolute;top:-40%;left:-20%;width:600px;height:600px;background:radial-gradient(circle,rgba(13,123,193,.15) 0%,transparent 70%);border-radius:50%}
    body::after{content:'';position:absolute;bottom:-30%;right:-15%;width:500px;height:500px;background:radial-gradient(circle,rgba(13,123,193,.1) 0%,transparent 70%);border-radius:50%}
    .login-container{position:relative;z-index:1;width:100%;max-width:400px;padding:1.5rem}
    .login-card{background:#fff;border-radius:1.5rem;padding:2.5rem 2rem;box-shadow:0 25px 60px rgba(0,0,0,.3)}
    .logo-wrapper{text-align:center;margin-bottom:2rem}
    .logo-wrapper img{width:200px;height:200px;object-fit:contain;border-radius:1.25rem;box-shadow:0 8px 30px rgba(13,123,193,.25)}
    .logo-wrapper h1{font-size:1.75rem;font-weight:800;color:#04154B;margin-top:1rem;letter-spacing:-.02em}
    .logo-wrapper p{font-size:.85rem;color:#94a3b8;margin-top:.3rem}
    .form-group{margin-bottom:1.25rem}
    .form-group label{display:block;font-size:.75rem;font-weight:600;color:#475569;margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.05em}
    .input-wrapper{position:relative}
    .input-wrapper i{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:.85rem;transition:color .2s}
    .input-wrapper input{width:100%;padding:.75rem 1rem .75rem 2.75rem;border:2px solid #e2e8f0;border-radius:.75rem;font-size:.9rem;color:#1e293b;background:#f8fafc;outline:none;transition:all .2s}
    .input-wrapper input:focus{border-color:#0D7BC1;background:#fff;box-shadow:0 0 0 3px rgba(13,123,193,.1)}
    .input-wrapper input:focus+i{color:#0D7BC1}
    .btn-login{width:100%;padding:.85rem;background:linear-gradient(135deg,#0D7BC1,#04154B);color:#fff;border:none;border-radius:.75rem;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.02em;margin-top:.5rem}
    .btn-login:hover{transform:translateY(-1px);box-shadow:0 8px 25px rgba(13,123,193,.35)}
    .btn-login:active{transform:translateY(0)}
    .btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .error-msg{display:none;background:#fef2f2;border:1px solid #fecaca;border-radius:.75rem;padding:.75rem 1rem;margin-bottom:1rem;animation:shakeX .4s}
    .error-msg i{color:#dc2626;margin-right:.5rem}
    .error-msg span{color:#991b1b;font-size:.8rem}
    @keyframes shakeX{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
    .loading-spinner{display:none;width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin:0 auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    .footer-text{text-align:center;margin-top:1.5rem;color:rgba(255,255,255,.4);font-size:.7rem}
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo-wrapper">
       <img src="logo.png" alt="RefrigiHerrera" style="
    height: 100px;
">
        <h1>RefrigiHerrera</h1>
        <p>Sistema POS e Inventario</p>
      </div>

      <div id="error-box" class="error-msg">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="error-text">Credenciales incorrectas</span>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Usuario</label>
          <div class="input-wrapper">
            <input type="text" id="username" placeholder="Ingresa tu usuario" autocomplete="username" required>
            <i class="fa-solid fa-user"></i>
          </div>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
            <i class="fa-solid fa-lock"></i>
          </div>
        </div>
        <button type="submit" id="btn-submit" class="btn-login">
          <span id="btn-text">Iniciar Sesión</span>
          <div id="btn-spinner" class="loading-spinner"></div>
        </button>
      </form>
    </div>
    <p class="footer-text">© 2026 RefrigiHerrera</p>
  </div>

  <script>
    const SB_URL = 'https://muwthhwoxpooliatnmhk.supabase.co';
    const SB_KEY = 'sb_publishable_qfIeLtWYNzmQhLAjiGdh_Q_J3PQ5TID';
    const sb = window.supabase.createClient(SB_URL, SB_KEY);

    async function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const btn  = document.getElementById('btn-submit');
      const errBox  = document.getElementById('error-box');
      const errText = document.getElementById('error-text');
      const btnText = document.getElementById('btn-text');
      const spinner = document.getElementById('btn-spinner');

      errBox.style.display = 'none';

      if (!user || !pass) {
        errText.textContent = 'Ingresa usuario y contraseña';
        errBox.style.display = 'flex';
        return;
      }

      btn.disabled = true;
      btnText.style.display = 'none';
      spinner.style.display = 'block';

      try {
        const { data: users, error } = await sb.from('users')
          .select('*')
          .eq('username', user)
          .eq('password_hash', pass)
          .eq('active', true)
          .limit(1);

        if (error) throw error;

        if (!users || users.length === 0) {
          errText.textContent = 'Usuario o contraseña incorrectos';
          errBox.style.display = 'flex';
          btn.disabled = false;
          btnText.style.display = 'inline';
          spinner.style.display = 'none';
          return;
        }

        const loggedUser = users[0];
        localStorage.setItem('rh_session', JSON.stringify({
          authenticated: true,
          user: loggedUser.username,
          full_name: loggedUser.full_name,
          role: loggedUser.role,
          user_id: loggedUser.id,
          timestamp: Date.now()
        }));

        window.location.href = 'herrera.html';
      } catch (err) {
        console.error('Login error:', err);
        errText.textContent = 'Error de conexión. Verifica tu internet.';
        errBox.style.display = 'flex';
        btn.disabled = false;
        btnText.style.display = 'inline';
        spinner.style.display = 'none';
      }
    }

    (function checkSession() {
      const session = localStorage.getItem('rh_session');
      if (session) {
        try {
          const s = JSON.parse(session);
          if (s.authenticated && (Date.now() - s.timestamp < 86400000)) {
            window.location.href = 'herrera.html';
          }
        } catch(e) {}
      }
    })();
  </script>
</body>
</html>
